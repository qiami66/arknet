name: net-test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: 探测国内云服务器
        run: |
          echo "--- 50256 HTTP ---"
          curl -s -m 15 -o /dev/null -w "%{http_code} %{time_total}s\n" http://103.236.88.52:50256/health || echo FAIL
          echo "--- 34381 SSH ---"
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/103.236.88.52/34381' && echo OPEN || echo CLOSED
          echo "--- ping ---"
          ping -c 2 -W 3 103.236.88.52 || true
