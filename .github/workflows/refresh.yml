name: arknet refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arknet
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 还原账号
        env:
          ACC: ${{ secrets.ACCOUNTS_JSON }}
        run: python -c "import os,pathlib; pathlib.Path('accounts.json').write_text(os.environ['ACC'],encoding='utf-8')"

      - name: 刷新线路
        run: python refresh_all.py

      - name: 提交结果
        id: commit
        run: |
          git config user.name "arknet-bot"
          git config user.email "arknet-bot@users.noreply.github.com"
          git add nodes_full.json shadowrocket_anytls_live.txt sub_live_base64.txt \
                  clash_config.yaml flclash_config.yaml nodes_table.md
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "内容没变，跳过推送"
          else
            git commit -m "refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 刷新 CDN 缓存
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 15
          for f in sub_live_base64.txt shadowrocket_anytls_live.txt clash_config.yaml flclash_config.yaml nodes_table.md nodes_full.json; do
            code=$(curl -s -m 25 -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/qiami66/arknet@main/$f" || echo ERR)
            echo "purge $f -> $code"
          done
