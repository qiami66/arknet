name: arknet refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arknet
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 还原账号
        env:
          ACC: ${{ secrets.ACCOUNTS_JSON }}
        run: python -c "import os,pathlib; pathlib.Path('accounts.json').write_text(os.environ['ACC'],encoding='utf-8')"

      - name: 刷新线路
        run: python refresh_all.py

      - name: 提交结果
        run: |
          git config user.name "arknet-bot"
          git config user.email "arknet-bot@users.noreply.github.com"
          git add nodes_full.json shadowrocket_anytls_live.txt sub_live_base64.txt nodes_table.md
          git commit -m "refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no change"
          git push
